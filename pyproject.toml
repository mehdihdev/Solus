[project]
name = "solus-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "packages/api",
    "packages/companion",
    "packages/contracts/python",
    "livebench",
    "libs/solus-telemetry/python",
]
# Add as they are created: "integrations/*", "reasoning"

[tool.ruff]
line-length = 100
target-version = "py312"
# The quality hooks (H8/H10) pass changed files EXPLICITLY; force-exclude makes
# the excludes below apply even then (plain exclude only governs discovery).
force-exclude = true
# Vendored MCP-server fork trees (integrations/mcp/README.md) are reviewed
# third-party code, not Solus style-clean code — outside the lint law.
extend-exclude = [
    ".venv",
    "node_modules",
    "integrations/mcp/*/upstream",
    "integrations/mcp/*/vendor",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "N", "S"]
ignore = ["S101"]
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Shared fork-test helpers (integrations/mcp/tests/_lib) are imported by bare
# module name from each fork's tests/ (sys.path via per-fork conftest.py).
mypy_path = ["integrations/mcp/tests/_lib"]
# Vendored MCP-server fork trees are third-party code; Solus-authored areas
# (integrations/mcp/tests/, <fork>/solus/, <fork>/tests/) stay in scope.
exclude = [
    'integrations/mcp/[^/]+/upstream/',
    'integrations/mcp/[^/]+/vendor/',
]

# These packages ship no py.typed marker; treat their imports as untyped rather than error.
[[tool.mypy.overrides]]
# `OCP.*` is the CAD kernel (SOLUSDEV-60 lane), `msgpack` the LB-06 telemetry
# codec (LANE A), `mujoco` the simulator (LANE H), `ujson` the MicroPython json
# the solus-telemetry emitter falls back from — unrelated additions to the same list.
module = ["pgvector.*", "asyncpg", "OCP.*", "msgpack", "mujoco", "ujson"]
ignore_missing_imports = true

# mcap ships a layout mypy maps to two module names ("mcap" and "mcap.__init__"),
# aborting the whole run. Skip following into it; its surface is typed at our
# call sites (livebench/telemetry/mcap_*.py).
[[tool.mypy.overrides]]
module = ["mcap.*"]
follow_imports = "skip"
ignore_missing_imports = true

# Vendored MCP fork modules (kicad fork SOLUSDEV-100, altium fork
# SOLUSDEV-102): untyped third-party code imported by Solus-authored solus/
# wrappers. Module-scoped on purpose — never a blanket override.
[[tool.mypy.overrides]]
module = ["kicad_mcp.*", "kicad_sch_api.*", "sexpdata", "eda_agent.*"]
ignore_missing_imports = true

# mypy's `exclude` does not apply to explicitly-passed files (the H8/H10 hooks
# pass changed files by path), so vendored-tree modules are additionally
# silenced per-module. "main"/"run_tests"/"tests.*" are the vendored fork's
# top-level and tests-package modules; no Solus tests dir ships __init__.py,
# so nothing Solus-authored resolves into the "tests.*" namespace.
[[tool.mypy.overrides]]
module = [
    "kicad_mcp.*",
    "kicad_sch_api.*",
    "main",
    "run_tests",
    "tests",
    "tests.*",
    # altium fork (SOLUSDEV-102): src package + upstream/scripts/*.py top-level
    # modules (the H8/H10 hooks pass changed files by path, bypassing exclude).
    "eda_agent.*",
    # Since altium/__init__.py namespaced the fork, explicitly-passed upstream
    # files resolve as altium.upstream.* — Solus-authored altium.solus/tests
    # namespaces stay in scope.
    "altium.upstream.*",
    # altium's solus/ overlay imports dual-mode: relative in package mode,
    # absolute `solus.*` under bin/launch. That absolute name is FORK-LOCAL —
    # each fork puts its own solus/ on sys.path, and kicad's overlay uses the
    # bare `solus.*` form with no fallback — so the two forks define the same
    # top-level package with different contents and CANNOT be resolved in one
    # mypy run. CI never tries (`mypy packages/api/src packages/companion/src`,
    # .gitlab-ci.yml); only the by-path hooks above reach both at once, where
    # `solus.*` binds to whichever fork was seen first and the other's fallback
    # reads as a conflicting redefinition. Scoped to the one module with the
    # dual-mode block, not the overlay package.
    "altium.solus.server",
    "gen_tool_reference",
    "build",
    "build_placement_priors",
    "lint",
    "train_quality_model",
]
ignore_errors = true

# Two test dirs each ship a `conftest.py`; with no __init__.py they both resolve to
# the bare module name `conftest`, so a mypy run spanning both (the H10 changed-file
# gate) collides on which one exports which helper. Don't follow into it — a test's
# `from conftest import ...` yields Any, which is correct for pytest fixtures/helpers.
[[tool.mypy.overrides]]
module = ["conftest"]
follow_imports = "skip"
ignore_missing_imports = true

# `from conftest import <helper>` needs a `type: ignore[attr-defined]` when the H10
# gate's mypy run spans BOTH test dirs (the two same-named conftest modules collide
# and the wrong one resolves); the SAME line is clean when the run sees only the api
# tests. Don't warn on the now-unused ignore in that second case.
[[tool.mypy.overrides]]
module = ["test_bench_router"]
warn_unused_ignores = false

# libs/solus-telemetry/micropython/solus_telemetry.py targets MicroPython, which has no
# typing module: its bodies are type-checked, but its defs are not required to be annotated.
[[tool.mypy.overrides]]
module = ["micropython.solus_telemetry"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Per-test ceiling (pytest-timeout). The slowest legitimate tests are the 3 s
# timeout tests and STEP parses (seconds); five minutes is only ever hit by a
# hang, which then fails with every thread's stack instead of stalling CI.
timeout = 300
timeout_method = "thread"
testpaths = ["packages", "integrations", "reasoning", "livebench", "libs", "infrastructure/ci/tests"]
addopts = "-p no:launch_testing -p no:launch_pytest -p no:launch_ros"
# Setting norecursedirs REPLACES pytest's defaults, so the defaults we rely on
# are restated alongside the vendored MCP fork trees (upstream/, vendor/).
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    ".venv",
    "upstream",
    "vendor",
]
markers = [
    "live: real provider-API smoke tests; needs API keys, never run in CI (run with -m live)",
]
