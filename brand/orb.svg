<svg width="240" height="240" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Solus orb">
  <title>Solus orb</title>
  <defs>
    <!-- Off-centre highlight (matches the app's radial-gradient at 35% 32%). -->
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5" fx="0.38" fy="0.34">
      <stop offset="0%" stop-color="#FBE3A6"/>
      <stop offset="22%" stop-color="#EFBB58"/>
      <stop offset="58%" stop-color="#E5A43B"/>
      <stop offset="100%" stop-color="#E5A43B" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft outer glow (matches the box-shadow). -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="30" fill="#E5A43B" opacity="0.45" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="30" fill="url(#orb)"/>
</svg>
