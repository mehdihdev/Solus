<svg width="240" height="220" viewBox="0 0 240 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SOLUS">
  <title>Solus stacked lockup — orb over wordmark (light text)</title>
  <defs>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5" fx="0.38" fy="0.34">
      <stop offset="0%" stop-color="#FBE3A6"/>
      <stop offset="22%" stop-color="#EFBB58"/>
      <stop offset="58%" stop-color="#E5A43B"/>
      <stop offset="100%" stop-color="#E5A43B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7"/>
    </filter>
  </defs>
  <circle cx="120" cy="78" r="38" fill="#E5A43B" opacity="0.45" filter="url(#glow)"/>
  <circle cx="120" cy="78" r="38" fill="url(#orb)"/>
  <text x="120" y="170" text-anchor="middle" fill="#E6E9EE"
    font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="38" font-weight="700" letter-spacing="5">SOLUS</text>
</svg>
