<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Solus app icon (spectrum)">
  <title>Solus app icon — spectrum orb on the brand dark background</title>
  <defs>
    <clipPath id="ball"><circle cx="60" cy="60" r="34"/></clipPath>
    <filter id="b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="haze" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="9"/></filter>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <g id="orb">
      <g opacity="0.5" filter="url(#haze)">
        <circle cx="46" cy="50" r="30" fill="#62A9FF"/>
        <circle cx="76" cy="66" r="30" fill="#E5A43B"/>
        <circle cx="60" cy="80" r="26" fill="#E87FAE"/>
      </g>
      <g clip-path="url(#ball)" style="isolation:isolate">
        <circle cx="60" cy="60" r="34" fill="#0B0E13"/>
        <g style="mix-blend-mode:screen">
          <circle cx="44" cy="40" r="26" fill="#B98BEA" filter="url(#b)"/>
          <circle cx="39" cy="64" r="26" fill="#62A9FF" filter="url(#b)"/>
          <circle cx="56" cy="86" r="26" fill="#50D0B4" filter="url(#b)"/>
          <circle cx="83" cy="74" r="26" fill="#5BCD8C" filter="url(#b)"/>
          <circle cx="87" cy="47" r="26" fill="#E5A43B" filter="url(#b)"/>
          <circle cx="68" cy="31" r="24" fill="#E87FAE" filter="url(#b)"/>
        </g>
        <circle cx="49" cy="46" r="13" fill="url(#spec)" style="mix-blend-mode:screen"/>
      </g>
    </g>
  </defs>

  <rect width="256" height="256" rx="56" fill="#0A0C0F"/>
  <use href="#orb" transform="translate(128 128) scale(1.94) translate(-60 -60)"/>
</svg>
