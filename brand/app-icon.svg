      <stop offset="0%" stop-color="#FCE6AD"/>
      <stop offset="24%" stop-color="#EFBB58"/>
      <stop offset="60%" stop-color="#E5A43B"/>
      <stop offset="100%" stop-color="#E5A43B" stop-opacity="0"/>
