[project]
name = "solus-api"
version = "0.1.0"
description = "Solus core FastAPI backend (docs/api/API.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "arq>=0.26",
    "redis>=5.0",
    "pyjwt>=2.8",
    "uuid6>=2024.1.12",
    "email-validator>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solus_api"]
