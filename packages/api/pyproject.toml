[project]
name = "solus-api"
version = "0.1.0"
description = "Solus core FastAPI backend (docs/api/API.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "arq>=0.26",
    "redis>=5.0",
    "pyjwt>=2.8",
    "uuid6>=2024.1.12",
    "email-validator>=2.0",
    "pgvector>=0.4.2",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "msgpack>=1.1",
    "httpx>=0.28",
    "cryptography>=43.0",
    "boto3>=1.35",
    "anthropic>=0.116.0",
    "openai>=2.45.0",
    "google-genai>=2.11.0",
    "stripe>=11.0",
    "mcp>=1.28.1,<2.0",
    "sentry-sdk>=2.0",
    "packaging>=26.2",
    "pypdfium2==5.13.0",
]

[project.scripts]
stripe-setup = "solus_api.ops.stripe_setup:main"

[project.optional-dependencies]
# SOLUS-CAD-00 mechanical CAD ingestion. Deliberately OPTIONAL, not a runtime
# dependency: the wheel is ~60 MB and bundles an OCCT kernel that is
# LGPL-2.1-with-exception (the binding is Apache-2.0) — a licensing call
# `docs/contracts/metadata-extraction.md` §6.6 reserves to a human, unsigned as
# of this ticket. `step_parser` imports it lazily and degrades to a clear
# ConnectorError, so the API runs without it. Promote to `dependencies` once the
# licence review passes.
cad = ["cadquery-ocp-novtk>=7.9,<8"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.20",
    "respx>=0.21",
    "boto3-stubs[secretsmanager]>=1.35",
    # The STEP-reader suite (SOLUS-CAD-00) needs the optional `cad` extra; it is
    # in dev so CI exercises the real OCCT path. `test_step_parser.py` skips
    # cleanly wherever the wheel is unavailable.
    "cadquery-ocp-novtk>=7.9,<8",
    # The uvicorn E2E drives a real companion against a real socket (BRG-01/02).
    "solus-companion",
    # Parity tests pin the human-owned contracts package to the in-tree draft
    # (tests/test_contracts_package.py, SOLUSDEV-100).
    "solus-contracts",
    "pytest-xdist>=3.6",
    # A hung test must fail with a stack trace inside the CI hour, never eat it
    # (SOLUSDEV-246: a test:python job stalled at 63% until the 1 h job timeout).
    "pytest-timeout>=2.3",
]

[tool.uv.sources]
solus-companion = { workspace = true }
solus-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solus_api"]
