[project]
name = "solus-companion"
version = "0.1.0"
description = "Solus local bridge companion — launches vendored MCP servers and dials the cloud bridge (SOLUS-BRG-01)"
requires-python = ">=3.12"
dependencies = [
    "websockets>=14",
    "mcp>=1.28.1,<2.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solus_companion"]
