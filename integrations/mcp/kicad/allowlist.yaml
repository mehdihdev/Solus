# integrations/mcp/kicad/allowlist.yaml — the Solus-owned tool allowlist for
# the vendored lamaalrajih/kicad-mcp fork (SOLUSDEV-100 T1b draft; the WHOLE
# file is human-ratified at the MR — integrations/mcp/CLAUDE.md rule 2).
#
# Single source of truth (README): the discovery filter, the cloud bridge
# ingress gate (validate_inventory), and the fork-side trimming shim
# (solus/registration.py) all derive from THIS list. Validates against
# packages/api/src/solus_api/bridge/allowlist.py::ServerAllowlist — that model
# forbids extra fields, so the exposed/total ratio lives in PROVENANCE.md
# ("Exposed tools": 5 of 16 upstream tools exposed + 1 Solus-authored).
#
# Composed-name bound: every `kicad.{name}` here is <= 128 chars.
#
# NOTE: `set_symbol_property` is drafted NOW so nothing ever widens this
# allowlist later, but its implementation lands in T2b — the overlay does not
# register it yet (tests/test_overlay_tool_trimming.py pins that).
server: kicad
tools:
  - name: list_projects
    requires_confirmation: false
    reason: read-only enumeration of .kicad_pro files in the configured search paths
  - name: get_project_structure
    requires_confirmation: false
    reason: read-only listing of one project's files and metadata (draft name get_project_summary)
  - name: extract_project_netlist
    requires_confirmation: false
    reason: read-only KiCad-free schematic parse into netlist data (draft name extract_netlist)
  - name: analyze_schematic_connections
    requires_confirmation: false
    reason: read-only connection analysis over the parsed netlist (draft name get_schematic_summary)
  - name: analyze_bom
    requires_confirmation: false
    reason: read-only analysis of the project's exported BOM files
  - name: export_netlist
    requires_confirmation: false
    reason: non-destructive kicadxml export confined to the workspace (metadata-extraction.md section 2.1 invariant 5)
  - name: set_symbol_property
    requires_confirmation: true
    reason: mutates a design file on the customer machine (T2b write tool; implemented and registered via solus/registration.py since 0785fa8 — splice guard, workspace confinement, atomic replace)
