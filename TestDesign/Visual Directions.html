<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solus — Visual Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="directions/themes.js"></script>
<style>
  body { margin: 0; }
  @keyframes gmFlow { to { stroke-dashoffset: -22; } }
  .gm-flow { animation: gmFlow 1.6s linear infinite; }
  @keyframes gmOrb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .gm-orb { animation: gmOrb 2.6s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="directions/token-card.jsx"></script>
<script type="text/babel" src="directions/landing-mock.jsx"></script>
<script type="text/babel" src="directions/graph-mock.jsx"></script>
<script type="text/babel">
  const THEMES = window.SOLUS_THEMES;
  function App() {
    return (
      <DesignCanvas title="Solus — Visual Directions">
        {THEMES.map((t) => (
          <DCSection key={t.id} id={t.id} title={t.name} subtitle={t.desc}>
            <DCArtboard id={t.id + "-tokens"} label="Tokens" width={440} height={780}>
              <TokenCard t={t} />
            </DCArtboard>
            <DCArtboard id={t.id + "-landing"} label="Landing" width={1280} height={780}>
              <LandingMock t={t} />
            </DCArtboard>
            <DCArtboard id={t.id + "-graph"} label="Context Model" width={1440} height={900}>
              <GraphMock t={t} />
            </DCArtboard>
          </DCSection>
        ))}
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
