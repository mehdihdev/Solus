<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solus — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="app/theme.js"></script>
<style>
  :root {
    --ui: "IBM Plex Sans", sans-serif;
    --mono: "IBM Plex Mono", monospace;
    --bg: #0A0C0F; --sur: #10131A; --sur2: #161B23; --bd: #222834;
    --tx: #E6E9EE; --mut: #828B99; --acc: #E5A43B; --acc-ink: #0A0C0F;
    --ok: #5BCD8C; --warn: #E5A43B; --err: #E0564D;
    --sw: #62A9FF; --ee: #E3C25B; --me: #E87FAE; --rt: #5BCD8C;
  }
  html, body { margin: 0; background: var(--bg); }
  * { -webkit-font-smoothing: antialiased; }
  html[data-density="compact"] body { zoom: 0.88; }
  ::placeholder { color: var(--mut); opacity: 0.7; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-corner { background: transparent; }
  .sbtn:hover { filter: brightness(1.12); }
  .sbtn-ghost:hover, .sbtn-bare:hover { background: var(--sur2) !important; }

  @keyframes gmFlow { to { stroke-dashoffset: -22; } }
  .gm-flow { animation: gmFlow 1.6s linear infinite; }
  @keyframes gmOrb { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.18); opacity: 0.75; } }
  .gm-orb { animation: gmOrb 1.8s ease-in-out infinite; }
  @keyframes solSpin { to { transform: rotate(360deg); } }
  .sol-spin { animation: solSpin 0.8s linear infinite; }
  @keyframes solThink { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
  .sol-think { animation: solThink 1.4s ease-in-out infinite; }

  /* orb */
  @keyframes orbHalo { 0%,100% { transform: scale(0.92); opacity: 0.7; } 50% { transform: scale(1.12); opacity: 1; } }
  .orb-halo { animation: orbHalo 3s ease-in-out infinite; }
  @keyframes orbBlob1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .orb-blob1 { animation: orbBlob1 3s linear infinite; }
  @keyframes orbBlob2 { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
  .orb-blob2 { animation: orbBlob2 4s linear infinite; }
  @keyframes orbCore { 0%,100% { transform: scale(1); } 50% { transform: scale(0.86); } }
  .orb-core { animation: orbCore 2.2s ease-in-out infinite; }
  @keyframes tourOrbit { from { transform: rotate(0deg) translateX(7px); } to { transform: rotate(360deg) translateX(7px); } }
  .tour-orbit { animation: tourOrbit 3.4s linear infinite; }

  @keyframes toastIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .toast-in { animation: toastIn 0.35s cubic-bezier(.2,.9,.3,1); }
  @keyframes lineIn { from { transform: translateY(4px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .ob-logline { animation: lineIn 0.3s ease-out; }
  .bench-banner { animation: toastIn 0.4s cubic-bezier(.2,.9,.3,1); }

  /* rail flyout labels */
  .railbtn .flyout {
    position: absolute; left: 46px; top: 50%; transform: translateY(-50%) translateX(-4px);
    background: var(--sur2); border: 1px solid var(--bd); color: var(--tx);
    font-family: var(--ui); font-size: 11.5px; font-weight: 500; white-space: nowrap;
    padding: 5px 10px; border-radius: 3px; pointer-events: none; opacity: 0;
    transition: opacity 0.12s, transform 0.12s; z-index: 90;
  }
  .railbtn:hover .flyout { opacity: 1; transform: translateY(-50%) translateX(0); }
  .railbtn:hover { color: var(--tx); }

  @media (prefers-reduced-motion: reduce) {
    .gm-flow, .gm-orb, .orb-halo, .orb-blob1, .orb-blob2, .orb-core, .tour-orbit { animation: none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail" data-bg-color="#0A0C0F">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0A0C0F"></rect>
    <circle cx="600" cy="380" r="120" fill="#E5A43B" opacity="0.18"></circle>
    <circle cx="600" cy="380" r="80" fill="#E5A43B" opacity="0.45"></circle>
    <circle cx="600" cy="380" r="46" fill="#E5A43B"></circle>
    <circle cx="578" cy="360" r="14" fill="#F4D9A8"></circle>
    <text x="600" y="560" text-anchor="middle" font-family="monospace" font-size="44" letter-spacing="14" fill="#828B99">SOLUS</text>
  </svg>
</template>

<script src="app/data.js"></script>
<script type="text/babel" src="app/tweaks-panel.jsx"></script>
<script type="text/babel" src="app/util.jsx"></script>
<script type="text/babel" src="app/auth.jsx"></script>
<script type="text/babel" src="app/onboarding.jsx"></script>
<script type="text/babel" src="app/graph.jsx"></script>
<script type="text/babel" src="app/alert.jsx"></script>
<script type="text/babel" src="app/bench.jsx"></script>
<script type="text/babel" src="app/sol.jsx"></script>
<script type="text/babel" src="app/team-settings.jsx"></script>
<script type="text/babel" src="app/shell-main.jsx"></script>
</body>
</html>
