[project]
name = "solus-telemetry"
version = "0.1.0"
description = "Emit Solus LB-06 telemetry packets as JSON lines - no dependencies"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solus_telemetry"]
