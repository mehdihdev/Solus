appId: com.solusforge.solus
productName: Solus
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# Local-bridge companion (SOLUSDEV-154 / BRG-04): PyInstaller binary + vendored
# MCP servers, built per-platform by scripts/build-companion.sh into repo-root
# dist/companion/. Ships at <resources>/companion/solus-companion(.exe).
extraResources:
  - from: ../../dist/companion
    to: companion
# Code signing is the final, swappable step (external blocker: certs — see
# SOLUSDEV-148/149). At build time: Windows signs via CSC_LINK/CSC_KEY_PASSWORD
# env; macOS via a Developer ID identity + notarize: true below. Linux ARM dev
# builds stay unsigned this cycle.
win:
  executableName: Solus
nsis:
  artifactName: solus-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # Signing + notarization are a release requirement scheduled with SOLUSDEV-148/149
  # (needs Apple Developer certs). Flip once certs are provisioned.
  notarize: false
dmg:
  artifactName: solus-${version}.${ext}
linux:
  # The package name (@solus/desktop) is not a valid executable name.
  executableName: solus
  target:
    - AppImage
    - snap
    - deb
  maintainer: Solus Forge <mhussain@solusforge.com>
  category: Development
appImage:
  artifactName: solus-${version}.${ext}
npmRebuild: false
# No `publish` block: auto-update is not wired (electron-updater is unused) and no
# update feed exists yet. Adding a feed is a release decision for SOLUSDEV-148/149.
