<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Electron</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!--
      connect-src widened for Supabase Auth (ADR-009): REST over https, realtime
      over wss. font-src allows the locally-bundled @fontsource files (data: for
      inlined glyphs). Scripts stay 'self' only. The Solus REST API origin is
      appended to connect-src at build/serve time by the `solus-api-csp` plugin
      (electron.vite.config.ts), derived from VITE_API_BASE_URL — so it is scoped
      per environment (http loopback in dev, https in packaged builds) and never
      hardcoded here (SOLUSDEV-152).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
