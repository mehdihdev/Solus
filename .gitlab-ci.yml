# Solus CI/CD — ARM build on AWS self-hosted runner → ECS deploy.
stages: [lint, typecheck, test, security, build, deploy]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

variables:
  PNPM_STORE: "$CI_PROJECT_DIR/.pnpm-store"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  IMAGE_TAG: "arm-latest" # the tag your ECS task definition references

# Change-scoped jobs (SOLUSDEV-240 CI speedup). On MR pipelines a job runs only
# when files in its half of the monorepo changed; main always runs everything so
# a JS-only merge can never hide a Python break. `needs: []` makes every job a
# DAG root: nothing waits for the lint/typecheck STAGES to finish first.
.python-rules:
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - pyproject.toml
        - uv.lock
        - packages/api/**/*
        - packages/companion/**/*
        - packages/contracts/python/**/*
        - livebench/**/*
        - integrations/**/*
        - reasoning/**/*

.node-rules:
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .npmrc
        - tsconfig.base.json
        - eslint.config.mjs
        - .prettierrc.json
        - apps/**/*
        - packages/shared-types/**/*
        - packages/contracts/**/*
        - scripts/**/*

.node-base:
  image: node:22
  tags: [aws-arm]
  before_script:
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile
  cache:
    key: { files: [pnpm-lock.yaml] }
    paths: [.pnpm-store]

.python-base:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  tags: [aws-arm]
  before_script:
    - uv sync --all-packages --frozen || uv sync --all-packages
  cache:
    key: { files: [uv.lock] }
    paths: [.uv-cache]

lint:python:
  extends: [.python-base, .python-rules]
  stage: lint
  script: uv run ruff check .

lint:node:
  extends: [.node-base, .node-rules]
  stage: lint
  script: pnpm lint

typecheck:python:
  extends: [.python-base, .python-rules]
  stage: typecheck
  script: uv run mypy packages/api/src packages/companion/src

typecheck:node:
  extends: [.node-base, .node-rules]
  resource_group: arm-runner-heavy
  stage: typecheck
  variables:
    # The renderer's `tsc` needs ~500 MB of V8 heap; the ARM runner's default
    # cap (~470 MB on a 2 GB box) OOM-kills it (pipeline #2819426716).
    NODE_OPTIONS: "--max-old-space-size=1536"
  script: pnpm typecheck

test:python:
  extends: [.python-base, .python-rules]
  stage: test
  # SOLUSDEV-246: the full suite on the 2 GB ARM runner outgrew the 1 h default.
  # The effective limit is min(this, the runner's "Maximum job timeout" in
  # Settings → CI/CD → Runners), so that setting must be ≥ 3h too. A genuinely
  # hung test no longer eats the budget: pytest-timeout (pyproject
  # `timeout = 300`) fails it with every thread's stack after 5 min.
  timeout: 3h
  # One heavy job at a time on the shared 2 GB box: with `needs: []` every job is
  # a DAG root, so test:node's vitest workers and this suite's OCCT/MuJoCo
  # imports could land on the runner together and OOM each other.
  resource_group: arm-runner-heavy
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    FF_NETWORK_PER_BUILD: "true"
    POSTGRES_USER: solus
    POSTGRES_PASSWORD: solus
    POSTGRES_DB: solus
    SOLUS_TEST_DATABASE_URL: "postgresql+asyncpg://solus:solus@postgres:5432/solus_test"
  script:
    # The OCCT wheel is in the dev group precisely so CI exercises the real STEP
    # path (packages/api/pyproject.toml), but it dlopens libGL and bookworm-slim
    # ships no OpenGL runtime — so it imported nowhere and ~40 CAD tests SKIPPED
    # silently while the rest failed on unrelated-looking assertions.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libgl1
    # Fail LOUDLY if that ever regresses. A silent skip is the failure mode that
    # hid this: the suite stays green while the CAD path goes entirely untested.
    - uv run python -c 'from solus_api.connectors.step_parser import step_reader_available as ok; assert ok(), "OCCT unavailable — CAD tests would silently skip"'
    # SERIAL on purpose. `-n 2` on the 2 GB ARM runner OOM-killed nine xdist
    # workers in one run ("node down: Not properly terminated"); each restart
    # re-imports OCCT + MuJoCo, which is how a 10-minute suite took 95 minutes.
    # One worker (~700 MB) fits. Restore `-n 2` (conftest already gives every
    # xdist worker its own database) once the runner has ≥ 4 GB.
    - uv run pytest -q -rfE

test:node:
  extends: [.node-base, .node-rules]
  resource_group: arm-runner-heavy
  stage: test
  script: pnpm test

security:gitleaks:
  stage: security
  needs: []
  tags: [aws-arm]
  image: { name: "zricethezav/gitleaks:latest", entrypoint: [""] }
  script: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact

build:api-image:
  stage: build
  tags: [aws-arm]
  image: docker:27
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION amazon/aws-cli:latest ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_URI"
  script:
    - docker build -f infrastructure/docker/api.Dockerfile -t "$ECR_URI:$CI_COMMIT_SHORT_SHA" -t "$ECR_URI:$IMAGE_TAG" .
    - docker push "$ECR_URI:$CI_COMMIT_SHORT_SHA"
    - docker push "$ECR_URI:$IMAGE_TAG"

deploy:staging:
  stage: deploy
  tags: [aws-arm]
  image: { name: "amazon/aws-cli:latest", entrypoint: [""] }
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: staging
  script:
    # REGISTER the task definition, then point the service at it. `--force-new-deployment`
    # alone only re-pulls the image and leaves the service on whatever revision it was
    # created with — which is how staging ran for weeks on a console-made `solus-api:1`
    # whose variable names (`DB_HOST`) are not the ones the code reads
    # (`SOLUS_DATABASE_URL`), until a restart finally surfaced it as
    # `ConnectionRefusedError ('127.0.0.1', 5432)` during alembic.
    - TASKDEF_ARN=$(aws ecs register-task-definition --cli-input-json file://infrastructure/aws/taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text --region "$AWS_REGION")
    - aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$TASKDEF_ARN" --force-new-deployment --region "$AWS_REGION"
    - echo "Staging deploy triggered — image $CI_COMMIT_SHORT_SHA, taskdef $TASKDEF_ARN."
