# gitleaks configuration for Solus
# Extends the default ruleset, then allowlists known-safe example/placeholder values.
# Real secrets are still caught everywhere else — this only exempts documented examples.

[extend]
useDefault = true

[allowlist]
description = "Known-safe placeholders in example/template/documentation files"

# Files that legitimately contain example/placeholder secret-shaped strings:
#  - .env.example files show the SHAPE of env vars with dummy values
#  - skill/docs markdown shows example API usage
paths = [
  '''.*\.env\.example$''',
  '''\.claude/skills/.*\.md$''',
]

# Belt-and-suspenders: exempt the specific known-fake values by regex,
# so even if they appear elsewhere they won't trip the scanner.
#
# Prefer THIS over a `.gitleaksignore` fingerprint for a literal that lives in
# committed history. CI fetches shallow (`git depth 20`), so boundary commits
# have no parent and their whole tree reads as newly added — the finding gets
# attributed to whichever commit sits on the graft boundary, and that boundary
# MOVES with every push. A fingerprint pinned to one SHA therefore passes once
# and fails on the next pipeline; a value-based rule holds forever.
regexTarget = "line"
regexes = [
  '''sk_live_abc123''',
  # SOLUSDEV-241: a cache-lookup call, `self._stored(key, max_age_seconds=…)`,
  # that the generic-api-key rule read as "key = <value>". The call was
  # rewritten, but the line lives in history (commit 8db7aaa) and re-surfaces
  # on every graft boundary — hence a value rule, not a fingerprint.
  '''_stored\(key, max_age_seconds=''',
  # SOLUSDEV-100: the opaque storage-key UUID in the artifact-store tests — an
  # artifact id, never a credential (the constant is named STORAGE_REF now, but
  # the literal remains in history and re-surfaces on every graft boundary).
  '''0d7a5e2a-1c1a-4a6d-9d0e-2b6a5f9c1a10''',
  # SOLUSDEV-311: a made-up refresh token in the error scrubber's regression
  # table (apps/desktop/src/main/diagnostics/scrub.test.ts). The fixture is now
  # assembled at runtime, but the literal remains in history (commit 1504c486).
  '''f9Xk2LmQpR7s''',
  # A telemetry key comparison in hardware/presence_topology.py (on main since
  # 6b7faa19): generic-api-key reads `key == "probe.i2c.responding"` as a key
  # assignment. It is a probe signal name, never a credential. Surfaced by the
  # full-history scan a policy change triggers.
  '''key == "probe\.i2c\.responding"''',
  # SOLUSDEV-317: the command-gate/preview redaction fixture — a made-up
  # alphabet-sequence token (also with a `ghp_` prefix) in
  # packages/api/tests/test_command_gate.py and test_command_previews.py. Main
  # pinned it by fingerprint at the lines the same commit then moved (494/489/188
  # vs 496/201), and every merge of main re-attributes it to the merge commit
  # (SOLUSDEV-320's 69223577 was the first). A value rule holds for both.
  '''aB3dE5fG7hJ9kL1mN2pQ4rS6tU8vW0xY2zA4b''',
]

# You can also pin the exact findings by fingerprint (most surgical):
# stopwords or commits can be listed here if you prefer fingerprint-level allowlisting.
commits = []